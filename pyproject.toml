[project]
name = "asmr-app"
version = "0.1.0"
description = "Tự xử lý âm thanh ASMR tô màu: đo, chọn thông số theo quy tắc, chạy pipeline 7 bước"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "numba>=0.60",
  "soundfile>=0.12",
  "matplotlib>=3.8",
  "anthropic>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyloudnorm>=0.1.1", "httpx>=0.27"]  # pyloudnorm chỉ để đối chiếu LUFS trong test
queue = ["rq>=1.16", "redis>=5"]  # ASMR_RUNNER=rq, khi chạy trên server

[project.scripts]
asmr = "asmrcore.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asmrcore", "asmrserver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
